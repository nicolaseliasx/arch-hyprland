# Commands and Apps to be executed at launch

# Keep tiled windows stacked vertically on the portrait monitor.
exec-once = $HOME/.config/hypr/scripts/DP2ColumnLayout.py

# Wallpaper daemon compatibility (swww/awww)
exec-once = $HOME/.config/hypr/scripts/WallpaperDaemon.sh

# Launch primary apps on fixed workspaces.
exec-once = [workspace 1 silent] firefox
exec-once = [workspace special:special silent] obsidian
# exec-once = $HOME/.config/hypr/scripts/Workspace9Startup.sh
exec-once = fastpotify
exec-once = $HOME/.config/hypr/scripts/slack-work-hours.sh
