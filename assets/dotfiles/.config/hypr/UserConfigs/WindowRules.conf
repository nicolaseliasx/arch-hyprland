# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# This file is used to add or overwrite window rules 
# This file will not be modified during dotfiles updates

# Place primary apps on their expected workspaces.
windowrule = match:class ^([Ff]irefox|org.mozilla.firefox|[Ff]irefox-esr|[Ff]irefox-bin)$, workspace 1
# Dedicated Neovim review terminal; ordinary terminals keep their normal rules.
windowrule = match:class ^(neovim-workspace)$, workspace 2
windowrule = match:class ^(neovim-workspace)$, float off
windowrule = match:class ^(neovim-workspace)$, opacity 1.0 override 1.0 override 1.0 override
windowrule = match:class ^(neovim-workspace)$, no_dim on
# windowrule = match:class ^([Oo]bsidian|obsidian)$, workspace 8 silent
windowrule = match:class ^([Ss]lack)$, workspace 9 silent
windowrule = match:class ^([Ss]potify|spotify|[Ff]astpotify)$, workspace special:special silent
windowrule = match:class ^([Ss]potify|spotify|[Ff]astpotify)$, splitratio -0.3
windowrule = match:class ^([Oo]bsidian|obsidian)$, workspace special:special silent
windowrule = match:class ^(kitty-boot-bottom)$, workspace 9 silent

# Keep browsers, Slack and IDEs fully visible even when unfocused.
windowrule = match:tag browser, opacity 1.0 override 1.0 override 1.0 override
windowrule = match:tag browser, no_dim on

windowrule = match:tag projects, opacity 1.0 override 1.0 override 1.0 override
windowrule = match:tag projects, no_dim on

windowrule = match:class ^(Slack)$, opacity 1.0 override 1.0 override 1.0 override
windowrule = match:class ^(Slack)$, no_dim on
windowrule = match:class ^([Ss]potify|spotify|[Ff]astpotify)$, opacity 1.0 override 1.0 override 1.0 override
windowrule = match:class ^([Ss]potify|spotify|[Ff]astpotify)$, no_dim on
windowrule = match:class ^(discord)$, opacity 1.0 override 1.0 override 1.0 override

# Keep Stremio fully visible and undimmed when unfocused.
windowrule = match:class ^([Ss]tremio.*)$, opaque on
windowrule = match:class ^([Ss]tremio.*)$, no_dim on
# Cover common VSCode/JetBrains derivatives not tagged by the vendor defaults.
windowrule = match:class ^([Cc]ursor|cursor|Windsurf|windsurf|com\\.google\\.AndroidStudio)$, opacity 1.0 override 1.0 override 1.0 override
windowrule = match:class ^([Cc]ursor|cursor|Windsurf|windsurf|com\\.google\\.AndroidStudio)$, no_dim on

# Keep terminals nearly opaque over the black Kitty background.
windowrule = match:tag terminal, opacity 1.0 override 0.98 override 1.0 override
windowrule = match:tag terminal, no_blur on
windowrule = match:class ^(kitty)$, animation popin 88%
windowrule = match:class ^(system-update)$, float on, size (monitor_w*0.45) (monitor_h*0.6), center on

# Keep startup apps tiled so the vertical monitor can manage layout normally.
