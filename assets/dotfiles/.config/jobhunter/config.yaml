# Non-secret local configuration. Set OPENAI_API_KEY only in your environment.
timezone: America/Sao_Paulo
profile_dir: $HOME/projects/job-hunter/profile
mode: review
auto_enabled: false
auto_adapter_allowlist:
  - linkedin@2
submission:
  mode: manual
  daily_limit: 5
  minimum_manual_score: 70
  minimum_auto_score: 85
  adapter_allowlist:
    - linkedin@2
  daily_ats_limit: 5
  daily_company_limit: 1
  cooldown_seconds: 1800
auto_reservation_ttl_seconds: 900
auto_failure_threshold: 1
request_timeout_seconds: 30
max_download_bytes: 10000000
discovery_limit: 100
preparation_limit: 20
# Required before enabling OpenAI-backed scheduled evaluation.
ai_daily_budget_micros: 1000000
evidence_retention_days: 90

linkedin:
  hunter:
    enabled: true
    search_terms:
      - engenheiro de software backend
      - desenvolvedor back end sênior
      - python developer remote
    location: Brazil
    easy_apply_only: true
    max_pages: 3
    jobs_per_run: 3
  applier:
    daily_limit: 8
    min_score: 80
    step_delay_ms: [800, 2500]

dashboard:
  lan_enabled: true
  base_url: http://192.168.15.22:8765

diagnostics:
  retention_days: 90

agent_resume_maker:
  provider: agy
  model: gemini-3.1-pro-high
  project_path: $HOME/projects/agent-resume-maker
  timeout_seconds: 900
